<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="780" fill="#ffffff"/>

  <text x="490" y="90" font-size="44" font-weight="bold" text-anchor="middle" fill="#111">NPI inference</text>

  <g fill="#dce6f2" stroke="#6b7f99" stroke-width="2" stroke-linejoin="round">
    <!-- output program (up) -->
    <polygon points="480,356 480,272 463,272 495,228 527,272 510,272 510,356"/>
    <!-- previous NPI state (right) -->
    <polygon points="248,430 330,430 330,413 374,445 330,477 330,460 248,460"/>
    <!-- next NPI state (right) -->
    <polygon points="622,430 705,430 705,413 749,445 705,477 705,460 622,460"/>
    <!-- environment observation (curved, up) -->
    <path d="M120,635 L410,635 A40,40 0 0 0 450,595 L450,580 L433,580 L465,538 L497,580 L480,580 L480,595 A70,70 0 0 1 410,665 L120,665 Z"/>
    <!-- input program (up) -->
    <polygon points="530,665 530,580 513,580 545,538 577,580 560,580 560,665"/>
  </g>

  <rect x="382" y="358" width="234" height="176" fill="#5b8ad9" stroke="#3b5c9a" stroke-width="2"/>
  <text x="396" y="392" font-size="26" fill="#14254a">NPI</text>
  <text x="396" y="426" font-size="26" fill="#14254a">Core</text>
  <text x="482" y="472" font-size="40" fill="#e6efff">h<tspan font-size="24" dy="10">t</tspan></text>

  <g font-size="26" fill="#333">
    <text x="455" y="260" text-anchor="end">Output program</text>
    <text x="118" y="434">Previous</text>
    <text x="118" y="470">NPI state</text>
    <text x="753" y="440">Next</text>
    <text x="753" y="476">NPI state</text>
    <text x="570" y="652">Input program</text>
    <text x="172" y="694">Environment</text>
    <text x="172" y="728">observation</text>
  </g>
</svg>
